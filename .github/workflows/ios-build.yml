# Builds an UNSIGNED iOS app (Domovoi.ipa) on a GitHub macOS runner, since
# Flutter can only build iOS on macOS. Install it on a device with
# `xtool install Domovoi.ipa` (xtool signs it with your Apple account).
#
# Run it from GitHub → Actions → "iOS build" → Run workflow.
name: iOS build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.6 # same as local development
          cache: true

      - run: flutter pub get

      # Same prod config as the Android release build (public values only).
      - run: >
          flutter build ios --release --no-codesign
          --dart-define-from-file=config/prod.json

      # An .ipa is a zip with the app under Payload/.
      - name: Package Domovoi.ipa
        run: |
          mkdir -p Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -qry Domovoi.ipa Payload

      # The repo is public, so anyone signed in to GitHub can download this;
      # it holds nothing beyond what the source already shows.
      - uses: actions/upload-artifact@v4
        with:
          name: Domovoi-ipa
          path: Domovoi.ipa
          retention-days: 7
