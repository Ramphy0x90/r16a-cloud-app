# Launcher icons, generated from assets/branding (see tool/branding/).
# Regenerate: dart run flutter_launcher_icons
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/branding/icon.png"
  remove_alpha_ios: true
  min_sdk_android: 24
  # Android 8+ adaptive icon; monochrome = Android 13 themed icons.
  adaptive_icon_background: "#0A0A0B"
  adaptive_icon_foreground: "assets/branding/icon_foreground.png"
  adaptive_icon_monochrome: "assets/branding/icon_monochrome.png"
